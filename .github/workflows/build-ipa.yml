name: Build Dini Pay IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build Dini Pay IPA & TIPA
        run: |
          cd ios-app
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Install Theos & Build Tweak DEB
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          export THEOS=~/theos
          cd ios-tweak
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p ../ios-app/output
          cp packages/*.deb ../ios-app/output/ || true

      - name: Upload Artifacts (IPA, TIPA, DEB)
        uses: actions/upload-artifact@v4
        with:
          name: DiniPay-Package
          path: |
            ios-app/output/DiniPay.ipa
            ios-app/output/DiniPay.tipa
            ios-app/output/*.deb
